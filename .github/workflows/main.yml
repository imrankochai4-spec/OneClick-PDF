name: Build OneClick Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: unzip -o OneClick-Complete-Project.zip

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install

      - name: Reset Android Folder
        run: rm -rf android

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Sync Web Assets
        run: npx cap sync android

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload OneClick APK
        uses: actions/upload-artifact@v4
        with:
          name: OneClick-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
